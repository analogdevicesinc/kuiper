name: Workshop Sales 2026
on:
  workflow_dispatch:
  push:
    branches:
      - workshop/sales_2026
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches:
      - workshop/sales_2026
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  Build:
    permissions: 
      contents: read
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        build_type: [rpi5]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          fetch-depth: 0
      - name: Set env variabiles
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH=$GITHUB_BASE_REF
          else
            BRANCH=$GITHUB_REF_NAME
          fi
          branch_name=$(echo $BRANCH | tr 'a-z' 'A-Z' | sed 's/[^[:alnum:]]/_/g')
          type=$( echo ${{ matrix.build_type }} | tr 'a-z' 'A-Z')
          echo ARTIFACT_NAME=sales_2026_"${{ matrix.build_type }}" >> $GITHUB_ENV
          echo BRANCH_NAME="$branch_name"_"$type" >> $GITHUB_ENV
      - name: Build image
        run: |
          rm config && mv config-${{matrix.build_type}} config
          sudo KUIPER_VARIANT=custom_"${{ matrix.build_type }}" bash build-docker.sh
          ls kuiper-volume/*.zip >/dev/null 2>&1 || exit 2
          sudo mv kuiper-volume/*.zip "kuiper-volume/${ARTIFACT_NAME}_image.zip"
      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kuiper-volume/${{ env.ARTIFACT_NAME }}_image.zip
          archive: false
      - name: Upload meta
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}_meta.zip
          path: |
            ${{ github.workspace }}/kuiper-volume
            !${{ github.workspace }}/kuiper-volume/sources
            !${{ github.workspace }}/kuiper-volume/*.zip
      - name: Upload sources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}_sources.zip
          path:
            ${{ github.workspace }}/kuiper-volume/sources
