name: Kuiper2.0
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  Build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        arch: [32, 64]
        build_type: [basic, full]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set env variabiles
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH=$GITHUB_BASE_REF
          else
            BRANCH=$GITHUB_REF_NAME
          fi
          branch_name=$(echo $BRANCH | tr 'a-z' 'A-Z' | sed 's/[^[:alnum:]]/_/g')
          type=$( echo ${{ matrix.build_type }} | tr 'a-z' 'A-Z')
          echo ARTIFACT_NAME=kuiper_"${{ matrix.build_type }}"_"${{ matrix.arch }}" >> $GITHUB_ENV
          echo BRANCH_NAME="$branch_name"_"$type"_"${{ matrix.arch }}" >> $GITHUB_ENV
      - name: Build image
        run: |
          ci/modify_config.sh ./config "${{ vars[format('{0}', env.BRANCH_NAME )] }}"
          sudo KUIPER_VARIANT="${{ matrix.build_type }}" bash build-docker.sh
          ls kuiper-volume/*.zip >/dev/null 2>&1 || exit 2
          sudo mv kuiper-volume/*.zip "kuiper-volume/${ARTIFACT_NAME}_image.zip"
      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kuiper-volume/${{ env.ARTIFACT_NAME }}_image.zip
          archive: false
      - name: Upload meta
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}_meta.zip
          path: |
            ${{ github.workspace }}/kuiper-volume
            !${{ github.workspace }}/kuiper-volume/*.zip

  Build_with_qemu:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [32, 64]
        build_type: [basic]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set env variabiles
        run: |
          BRANCH=$GITHUB_BASE_REF
          branch_name=$(echo $BRANCH | tr 'a-z' 'A-Z' | sed 's/[^[:alnum:]]/_/g')
          type=$( echo ${{ matrix.build_type }} | tr 'a-z' 'A-Z')
          echo BRANCH_NAME="$branch_name"_"$type"_"${{ matrix.arch }}" >> $GITHUB_ENV
      - name: Build image
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          ci/modify_config.sh ./config "${{ vars[format('{0}', env.BRANCH_NAME )] }}"
          sudo KUIPER_VARIANT="${{ matrix.build_type }}" bash build-docker.sh
          ls kuiper-volume/*.zip >/dev/null 2>&1 && exit 0 || exit 2

  Trigger_workflow:
    needs: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Trigger docker build
        run: gh workflow run docker-image-build.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
