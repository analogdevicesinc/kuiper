name: docker image build
on: workflow_dispatch

jobs:
  Build:
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      contents: read
      id-token: write
    strategy:
      matrix:
        kuiper_artifact: [kuiper_basic_32, kuiper_basic_64]
        include:
            - kuiper_artifact: kuiper_basic_32
              arch: linux/arm
            - kuiper_artifact: kuiper_basic_64
              arch: linux/arm64
    steps:
      - name: Generate Cloudsmith OIDC Token
        uses: cloudsmith-io/cloudsmith-cli-action@ad73fafb92e3e29a5166c529464c2df7658a608e # v3.1.0
        with:
          oidc-namespace: adi
          oidc-service-slug: ${{ secrets.CLOUDSMITH_USER }}
          export-auth-token: true

      - name: Docker login Cloudsmith
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: docker.cloudsmith.io/adi/containers
          username: ${{ secrets.CLOUDSMITH_USER }}
          password: ${{ env.CLOUDSMITH_API_KEY }}

      - name: Checkout Dockerfile for image building
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/Dockerfile
          sparse-checkout-cone-mode: false

      - name: Download image
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: kuiper2_0-build.yml
          branch: main
          name: ${{ matrix.kuiper_artifact }}_image
          repo: analogdevicesinc/kuiper

      - name: Create .tar file
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          zip_file=$(ls *.zip)
          unzip ${zip_file} -d .
          img_file=$(ls *.img)
          sudo losetup -fP ${img_file}
          loop_device=$(losetup --list | grep "$(basename "ADI-Kuiper-Linux.*.img")" | cut -f1 -d' ')
          mkdir rootfs
          sudo mount "${loop_device}p2" ./rootfs
          (
            cd rootfs
            sudo tar -cf ../kuiper_image.tar .
          )
          sudo umount ./rootfs
          sudo losetup -d ${loop_device}

      - name: Test build
        run: |
          docker buildx create --name armbuilder
          docker buildx use armbuilder
          docker buildx build --builder armbuilder -t test_kuiper_image --platform ${{ matrix.arch }} --load -f ./ci/Dockerfile .
          ARCH_CHECK=$(docker run --platform ${{ matrix.arch }} test_kuiper_image:latest uname -a)
          echo "$ARCH_CHECK"

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          push: true
          file: ci/Dockerfile
          context: .
          platforms: ${{ matrix.arch }}
          tags: |
            docker.cloudsmith.io/adi/containers/${{ matrix.kuiper_artifact }}:latest
