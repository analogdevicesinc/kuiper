name: docker image build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "kuiper2_0-build run id (blank = latest successful on main)"
        required: false

jobs:
  Build:
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        kuiper_artifact: [kuiper_basic_32, kuiper_basic_64]
        include:
            - kuiper_artifact: kuiper_basic_32
              arch: linux/arm
            - kuiper_artifact: kuiper_basic_64
              arch: linux/arm64
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Dockerfile for image building
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/Dockerfile
          sparse-checkout-cone-mode: false

      - name: Resolve build run id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="${{ inputs.run_id }}"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list -R analogdevicesinc/kuiper \
                       --workflow kuiper2_0-build.yml --branch main \
                       --status success -L1 --json databaseId -q '.[0].databaseId')
          fi
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.kuiper_artifact }}_image.zip
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .tar file
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          if ls *.zip >/dev/null 2>&1; then
            unzip -o "$(ls *.zip)" -d .
          fi
          img_file=$(ls *.img)
          sudo losetup -fP ${img_file}
          loop_device=$(losetup --list | grep "$(basename "ADI-Kuiper-Linux.*.img")" | cut -f1 -d' ')
          mkdir rootfs
          sudo mount "${loop_device}p2" ./rootfs
          (
            cd rootfs
            sudo tar -cf ../kuiper_image.tar .
          )
          sudo umount ./rootfs
          sudo losetup -d ${loop_device}

      - name: Test build
        run: |
          docker buildx create --name armbuilder
          docker buildx use armbuilder
          docker buildx build --builder armbuilder -t test_kuiper_image --platform ${{ matrix.arch }} --load -f ./ci/Dockerfile .
          ARCH_CHECK=$(docker run --platform ${{ matrix.arch }} test_kuiper_image:latest uname -a)
          echo "$ARCH_CHECK"

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          push: true
          file: ci/Dockerfile
          context: .
          platforms: ${{ matrix.arch }}
          tags: |
            aandrisa/${{ matrix.kuiper_artifact }}:latest
            ghcr.io/analogdevicesinc/kuiper/${{ matrix.kuiper_artifact }}:latest
