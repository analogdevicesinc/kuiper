# The login console on the ACM serial port of the USB gadget (ttyGS0) without
# the TTY reset of systemd: systemd resets the terminal of a getty under a lock
# on /dev/console, and a write to ttyGS0 blocks while no USB host reads the
# port, so the reset of ttyGS0 would keep the lock and the other consoles
# (ttyS1) would get no login prompt. Without the reset (and with a fixed size,
# no ANSI size query), only agetty itself waits on ttyGS0, without the lock,
# until a host reads the port.
[Service]
TTYReset=no
TTYRows=24
TTYColumns=80
