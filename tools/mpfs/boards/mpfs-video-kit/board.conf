# The PolarFire SoC Video Kit (MPFS250T) in the boot files of
# tools/mpfs/build-boot-files.sh (sourced)

# The board in kuiper.json (the HDL carrier, as zed or zcu102), and the folder
# of its boot files (payload.bin, boot.scr, uboot.env), named as its kernel
# devicetree (mpfs-sev-kit.dts)
KUIPER_BOARD=mpfs_video_kit
BOARD_FOLDER=mpfs-sev-kit

# The projects: <eval board> <target> <devicetree>. The devicetree of the ADI
# Linux build goes to <target>/<devicetree>/mss.dtb, as the Xilinx ones go to
# <target>/<specific_folder>/devicetree.dtb; the target is the HDL project on
# the board (projects/fmcomms2/mpfs_video_kit).
PROJECTS="
	fmcomms2 mpfs-sev-kit-ad936x-fmcomms2-3-4 mpfs-sev-kit-ad9361-fmcomms2-3
	fmcomms3 mpfs-sev-kit-ad936x-fmcomms2-3-4 mpfs-sev-kit-ad9361-fmcomms2-3
	fmcomms4 mpfs-sev-kit-ad936x-fmcomms2-3-4 mpfs-sev-kit-ad9364-fmcomms4
"

# U-Boot, its environment and the HSS payload, as the Microchip Yocto BSP
# (meta-mchp, release linux4microchip-2026.04) builds them for the board
# (MCHP_BOARD): U-Boot of u-boot-mchp at the commit of the meta-mchp
# u-boot-mchp_<UBOOT_VERSION> recipe, with the board configuration fragment;
# the hss-payload-generator of the HSS in the eNVM of the board (v2026.04.1)
MCHP_BOARD=mpfs-video-kit
META_MCHP_URL=https://github.com/linux4microchip/meta-mchp.git
META_MCHP_COMMIT=b8b0e21be7d83f6fff8f16b849d24376052118a6
UBOOT_URL=https://github.com/linux4microchip/u-boot-mchp.git
UBOOT_VERSION=2025.07
UBOOT_DEFCONFIG=microchip_mpfs_videokit_defconfig
UBOOT_ENV_SIZE=0x2000
HSS_URL=https://github.com/polarfire-soc/hart-software-services.git
HSS_COMMIT=711a983527cef51b8d1dbb92f91d1674a02f2270

# The license files of these sources, relative to them, which go into the
# package as they are (tools/collect-licenses.sh)
META_MCHP_LICENSE_FILES="meta-mchp-polarfire-soc/COPYING.MIT"
UBOOT_LICENSE_FILES="Licenses/README Licenses/gpl-2.0.txt"
HSS_LICENSE_FILES="LICENSE.md"

# The root file system of the Kuiper images is on partition 2 (the default of
# the meta-mchp environment is 3)
UBOOT_ENV_ROOTPART=2
